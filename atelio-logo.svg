<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="1120" fill="#ffffff"/>

  <!-- Brand palette: Orange #F47216 · Warm dark #1C120C · White #FFFFFF -->

  <!-- ===================== OPTION 1 — Horizontal, light background ===================== -->
  <g transform="translate(150,120)">
    <g transform="translate(0,-18)">
      <rect x="0" y="0" width="72" height="72" rx="16" fill="#F47216"/>
      <path d="M20 52 L36 18 L52 52 M27.5 42 L44.5 42" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="98" y="36" font-size="58" font-weight="700" letter-spacing="7" fill="#1C120C">ATELIO</text>
    <text x="100" y="64" font-size="15" font-weight="500" letter-spacing="4.2" fill="#8A7F77">POWERED BY MECANO</text>
  </g>
  <line x1="150" y1="250" x2="750" y2="250" stroke="#ECECEC" stroke-width="1"/>

  <!-- ===================== OPTION 2 — Stacked / centered ===================== -->
  <g transform="translate(450,415)" text-anchor="middle">
    <text x="0" y="0" font-size="76" font-weight="800" letter-spacing="11" fill="#1C120C">ATELIO</text>
    <line x1="-120" y1="28" x2="-40" y2="28" stroke="#F47216" stroke-width="2.5"/>
    <text x="0" y="36" font-size="15" font-weight="600" letter-spacing="5.5" fill="#8A7F77">POWERED BY MECANO</text>
    <line x1="40" y1="28" x2="120" y2="28" stroke="#F47216" stroke-width="2.5"/>
  </g>
  <line x1="150" y1="555" x2="750" y2="555" stroke="#ECECEC" stroke-width="1"/>

  <!-- ===================== OPTION 3 — On dark (primary) ===================== -->
  <g transform="translate(150,610)">
    <rect x="0" y="0" width="600" height="190" rx="18" fill="#1C120C"/>
    <g transform="translate(60,62)">
      <rect x="0" y="0" width="66" height="66" rx="15" fill="#F47216"/>
      <path d="M18 48 L33 16 L48 48 M25 38 L41 38" stroke="#ffffff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="92" y="34" font-size="52" font-weight="700" letter-spacing="7" fill="#ffffff">ATELIO</text>
      <text x="94" y="60" font-size="14" font-weight="500" letter-spacing="4" fill="#F47216">POWERED BY MECANO</text>
    </g>
  </g>
  <line x1="150" y1="850" x2="750" y2="850" stroke="#ECECEC" stroke-width="1"/>

  <!-- ===================== OPTION 4 — Icon set ===================== -->
  <g transform="translate(150,905)">
    <text x="0" y="0" font-size="13" font-weight="600" letter-spacing="3" fill="#9A9A9A">ICON</text>
    <g transform="translate(0,20)">
      <rect x="0" y="0" width="88" height="88" rx="18" fill="#F47216"/>
      <path d="M24 62 L44 20 L64 62 M33 50 L55 50" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(128,20)">
      <rect x="0" y="0" width="88" height="88" rx="18" fill="#1C120C"/>
      <path d="M24 62 L44 20 L64 62 M33 50 L55 50" stroke="#F47216" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(256,20)">
      <rect x="0" y="0" width="88" height="88" rx="18" fill="#ffffff" stroke="#E2E2E2" stroke-width="2"/>
      <path d="M24 62 L44 20 L64 62 M33 50 L55 50" stroke="#F47216" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
